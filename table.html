<!DOCTYPE html>
<html>
<head>
    <title>Student Table</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            text-align: center;
        }
        table {
            margin: 30px auto;
            border-collapse: collapse;
            width: 70%;
            background-color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        tr:hover {
            background-color: #ddd;
        }
        caption {
            font-size: 24px;
            font-weight: bold;
            margin: 10px;
        }
    </style>
</head>
<body>

    <table>
        <caption>Student Details</caption>
        <tr>
            <th>Roll No</th>
            <th>Name</th>
            <th>Class</th>
            <th>Percentage</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Pritam</td>
            <td>12th</td>
            <td>85%</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Rahul</td>
            <td>12th</td>
            <td>78%</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Sneha</td>
            <td>12th</td>
            <td>92%</td>
        </tr>
        <tr>
            <td>4</td>
            <td>Amit</td>
            <td>12th</td>
            <td>88%</td>
        </tr>
    </table>

</body>
</html>
